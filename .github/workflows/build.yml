name: build

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}  # every main push gets its release

jobs:
  windows:
    name: test, build exe, check on a real desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # windows-latest has the Windows 11 24H2-style desktop; windows-2022 the older
        # Windows 10 / Windows 11 up to 23H2 style (the desktop is "split" into a WorkerW).
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Stamp build number
        run: python tools/write_build_info.py --build ${{ github.run_number }} --commit ${{ github.sha }}

      - name: Build VerseDesk.exe
        run: python -m PyInstaller --noconfirm --clean VerseDesk.spec

      - name: Exe size
        shell: pwsh
        run: "'{0:N1} MB' -f ((Get-Item dist/VerseDesk.exe).Length / 1MB)"

      - name: Upload exe
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: VerseDesk-exe
          path: dist/VerseDesk.exe
          if-no-files-found: error

      - name: Desktop behaviour check (live Windows desktop)
        run: python tools/ci_desktop_check.py dist/VerseDesk.exe --report ci-report

      - name: Upload check report (screenshots, log.txt)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-report-${{ matrix.os }}
          path: ci-report/
          if-no-files-found: ignore

  data:
    # The embedded verses must be the official BSB text, byte for byte. The publisher replaces
    # its files in place, so a hash mismatch (new edition) or an outage is a warning, not a
    # failed build: the shipped data is still the pinned, verified edition.
    name: verse data equals the official BSB text
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download the pinned official BSB files
        id: download
        continue-on-error: true
        run: python -I tools/bsb.py download

      - name: Warn if the pinned edition could not be downloaded
        if: steps.download.outcome != 'success'
        run: echo "::warning::Could not download the pinned BSB edition (site unreachable or a new edition was published). verses.json was not re-checked."

      - name: Rebuild check (versedesk/data/verses.json from bsb.txt)
        if: steps.download.outcome == 'success'
        run: python -I tools/build_verses.py --check

  release:
    # Uses the GitHub CLI that is preinstalled on the runner (no third-party action to go
    # stale). The tag names the build; the asset name never changes, so
    # .../releases/latest/download/VerseDesk.exe is a permanent download link.
    name: publish release (main only)
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the exe built by this run
        run: |
          gh run download "${{ github.run_id }}" --name VerseDesk-exe --dir dist
          test -s dist/VerseDesk.exe && ls -l dist

      - name: Publish the release
        env:
          SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<EOF
          VerseDesk.exe — 설치 없이 바로 실행하는 단일 파일입니다.
          처음 실행할 때 Windows SmartScreen 경고가 나오면 "추가 정보" → "실행"을 누르세요.
          자세한 사용법은 README를 참고하세요.

          commit ${SHA}
          EOF
          gh release create "build-${{ github.run_number }}" dist/VerseDesk.exe \
            --target "${SHA}" --title "VerseDesk build ${{ github.run_number }}" \
            --notes-file notes.md --latest

  release-dry-run:
    # On other branches: exercise the same download and GitHub CLI access without publishing.
    name: release dry run (other branches)
    needs: windows
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the exe built by this run
        run: |
          gh run download "${{ github.run_id }}" --name VerseDesk-exe --dir dist
          test -s dist/VerseDesk.exe && ls -l dist

      - name: GitHub CLI can read releases
        run: gh release list --limit 3
